name: Build CloudStream 4.9.0 UI Redesign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0"

          mkdir -p "$ANDROID_HOME/platforms"

          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 \
              "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Extract modified source
        run: |
          set -eux

          echo "=== SEARCH SOURCE ZIP ==="

          ZIP=$(find . -type f \
            -iname 'CloudStream-4.9.0-UI-Redesign.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP tidak ditemukan!"
            echo "Pastikan ZIP sudah diupload ke repository."
            exit 1
          fi

          echo "Source ditemukan: $ZIP"

          mkdir -p source

          unzip -t "$ZIP"
          unzip -q "$ZIP" -d source

          echo "=== EXTRACTION SUCCESS ==="

          find source -name gradlew -type f

      - name: Locate Gradle project
        id: project
        run: |
          set -e

          GRADLEW="$(find source -name gradlew -type f | head -n 1)"

          test -n "$GRADLEW"

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project: $PROJECT_DIR"

      - name: Initialize Git metadata
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Prepare source for build"

      - name: Build Debug and Release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          chmod +x gradlew

          for attempt in 1 2 3; do
            echo "Build attempt $attempt"

            if ./gradlew --no-daemon \
              :app:assembleStableDebug \
              :app:assembleStableRelease; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 20
            fi
          done

          exit 1

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-4.9.0-UI-Redesign-APK
          path: |
            source/**/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
