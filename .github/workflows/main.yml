name: Build CloudStream UI Redesign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -name 'CloudStream-4.8.0-UI-Redesign-Source.zip' | head -n 1)"
          test -n "$ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          test -f source/cloudstream-4.8.0/gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        working-directory: source/cloudstream-4.8.0
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleStableRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-UI-Redesign-APK
          path: source/cloudstream-4.8.0/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
