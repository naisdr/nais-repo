name: Build CloudStream UI Redesign APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract source code
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -name 'CloudStream-4.8.0-UI-Redesign-Source.zip' | head -n 1)"
          test -n "$ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          find source -name gradlew -type f

      - name: Initialize Git metadata
        working-directory: source/cloudstream-4.8.0
        run: |
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Prepare source for build"

      - name: Locate Gradle project
        id: project
        run: |
          GRADLEW="$(find source -name gradlew -type f | head -n 1)"
          test -n "$GRADLEW"
          echo "dir=$(dirname "$GRADLEW")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: .
        run: |
          chmod +x "${{ steps.project.outputs.dir }}/gradlew"
          cd "${{ steps.project.outputs.dir }}"
          ./gradlew --no-daemon :app:assembleStableRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-UI-Redesign-APK
          path: source/**/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
